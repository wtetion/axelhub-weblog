<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axel Hub • Sign up</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/auth.css"></head><body><canvas id="bg"></canvas><main class="auth-shell"><section class="auth-card"><div class="auth-brand"><div class="auth-logo"><img src="/assets/axel-logo.png" alt="Axel Hub" onerror="this.style.display='none';document.getElementById('logoFallback').hidden=false"><span id="logoFallback" hidden>AX</span></div><div><div class="kicker">AXEL HUB</div><h1>Create account</h1><p>Each account gets its own private Web Log.</p></div></div><form id="signupForm"><label>Username<input name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9._-]{3,32}"><small>3–32 characters: letters, numbers, . _ -</small></label><label>Password<input name="password" type="password" autocomplete="new-password" required minlength="8"></label><label>Confirm password<input name="confirm" type="password" autocomplete="new-password" required minlength="8"></label><button class="primary" type="submit">Sign up</button><p id="error" class="error"></p></form><div class="switch">Already have an account? <a href="/login.html">Sign in</a></div></section></main><script src="/auth.js"></script></body></html>
