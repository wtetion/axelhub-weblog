<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axel Hub • Sign in</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/auth.css"></head><body><canvas id="bg"></canvas><main class="auth-shell"><section class="auth-card"><div class="auth-brand"><div class="auth-logo"><img src="/assets/axel-logo.png" alt="Axel Hub" onerror="this.style.display='none';document.getElementById('logoFallback').hidden=false"><span id="logoFallback" hidden>AX</span></div><div><div class="kicker">AXEL HUB</div><h1>Welcome back</h1><p>Sign in to your private Web Log.</p></div></div><form id="loginForm"><label>Username<input name="username" autocomplete="username" required minlength="3" maxlength="32"></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Sign in</button><p id="error" class="error"></p></form><div class="switch">New here? <a href="/signup.html">Create an account</a></div></section></main><script src="/auth.js"></script></body></html>
