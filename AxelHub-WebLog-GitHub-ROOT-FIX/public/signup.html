<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Axel Hub • Sign up</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/auth.css">
</head>
<body><canvas id="bg"></canvas>
<main class="auth-shell"><section class="auth-card">
  <div class="auth-card-top"><div class="auth-brand">
    <div class="auth-logo" aria-label="Axel Hub logo"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M13 48 29 12h7l15 36h-9l-3.2-8H25l-3.4 8H13Zm15-16h8l-4-10-4 10Z"/><path d="m35 36 4-7 11 19h-9l-6-12Z"/></svg></div>
    <div><div class="kicker">AXEL HUB</div><h1 data-i18n="signup.title">Create account</h1><p data-i18n="signup.subtitle">Each account gets its own private Web Log.</p></div>
  </div><div class="auth-lang"><button class="auth-lang-btn active" data-lang="en">EN</button><button class="auth-lang-btn" data-lang="th">ไทย</button></div></div>
  <form id="signupForm"><label><span data-i18n="auth.username">Username</span><input name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9._-]{3,32}"><small data-i18n="signup.usernameHint">3–32 characters: letters, numbers, . _ -</small></label>
  <label><span data-i18n="auth.password">Password</span><input name="password" type="password" autocomplete="new-password" required minlength="8"></label>
  <label><span data-i18n="auth.confirmPassword">Confirm password</span><input name="confirm" type="password" autocomplete="new-password" required minlength="8"></label>
  <button class="primary" type="submit" data-i18n="signup.submit">Sign up</button><p id="error" class="error"></p></form>
  <div class="switch"><span data-i18n="signup.already">Already have an account?</span> <a href="/login.html" data-i18n="signup.signin">Sign in</a></div>
</section></main><script src="/auth.js"></script></body></html>
